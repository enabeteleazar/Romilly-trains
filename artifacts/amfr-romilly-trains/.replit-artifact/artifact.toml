kind = "web"
previewPath = "/"
title = "AMFR Romilly-Trains"
description = "Le site du club de modélisme ferroviaire AMFR de Romilly-sur-Seine : réseau HO, photos, vidéos, actualités, expositions et contact."
version = "1.0.0"
id = "artifacts/amfr-romilly-trains"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18363

[services.development]
run = "pnpm --filter @workspace/amfr-romilly-trains run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amfr-romilly-trains", "run", "build" ]
serve = "static"
publicDir = "artifacts/amfr-romilly-trains/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18363"
BASE_PATH = "/"
